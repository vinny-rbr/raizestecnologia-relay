services:
  - type: web
    name: raizestecnologia-relay
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Postgres dos usuarios (em prod: string do Neon). JDBC completa.
      - key: DATABASE_URL
        sync: false      # ex.: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: PGUSER
        sync: false      # default dev: postgres
      - key: PGPASSWORD
        sync: false      # default dev: postgres
      # Segredo do JWT (base64 HS256). Gere um proprio em prod.
      - key: JWT_SECRET
        sync: false
      # Bootstrap do DONO na primeira subida (se app_user estiver vazio).
      - key: ADMIN_EMAIL
        sync: false      # default: admin@raizes.com
      - key: ADMIN_SENHA
        sync: false      # default: raizes123
      # Asaas (cobranca dos lojistas).
      - key: ASAAS_API_KEY
        sync: false      # cole a chave ($aact_...) no painel do Render
      - key: ASAAS_BASE_URL
        sync: false      # sandbox: https://sandbox.asaas.com/api/v3 | prod: https://api.asaas.com/v3
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false      # token do webhook (Asaas manda no header asaas-access-token)
