# Backend (relay Meu Giro), sem banco: o Postgres vem de fora (DATABASE_URL).
# No Coolify: Docker Compose apontando pra este arquivo, domínio na porta 9090 (o HTTPS é do Coolify).
# Rodar na mão: crie um .env do lado com as variáveis abaixo e `docker compose up -d --build`.
services:
  relay:
    build: .
    restart: always
    expose:
      - "9090"
    environment:
      PORT: "9090"
      TZ: America/Sao_Paulo
      # Postgres (JDBC completa, ex.: jdbc:postgresql://host:5432/meugiro)
      DATABASE_URL: ${DATABASE_URL}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UseG1GC -Xms256m -Xmx1536m}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
      # Asaas (cobrança dos lojistas)
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      # Push (JSON inteiro da conta de serviço do Firebase)
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS}
      # E-mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MASTER_ALERT_EMAIL: ${MASTER_ALERT_EMAIL}
      LINKPRO_PG_SENHA: ${LINKPRO_PG_SENHA}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090 && printf \"GET /api/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
