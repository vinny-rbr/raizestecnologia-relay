server:
  port: ${PORT:9090}
  # Instancia pequena (Render 512MB, poucas lojas): limita threads pra caber na RAM.
  # ~200 threads * 1MB de stack era o maior peso de memoria do processo.
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:25}
      min-spare: 3
    max-connections: 150
    accept-count: 50

spring:
  application:
    name: raizestecnologia-relay

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/raizes_relay}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Email (alertas ao MASTER / cobranca). Configure via env no Render; vazio = so-log.
  # Gmail: MAIL_HOST=smtp.gmail.com MAIL_USERNAME=vinnytecnologia@gmail.com MAIL_PASSWORD=<senha de app>
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Autenticacao / bootstrap do DONO (usados pelos arquivos do R1)
relay:
  jwt:
    # base64 do secret HS256; sobrescreva em prod via env JWT_SECRET
    secret: ${JWT_SECRET:cmFpemVzLXRlY25vbG9naWEtc3VwZXItc2VjcmV0LWtleS0yMDI2LWRldi1vbmx5LTEyMzQ1Ng==}
    expiration-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@raizes.com}
    senha: ${ADMIN_SENHA:raizes123}

logging:
  level:
    root: info
